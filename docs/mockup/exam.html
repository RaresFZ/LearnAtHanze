<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam page (mockup)</title>
  <script>try { var w = JSON.parse(sessionStorage.getItem('mock-wipe') || 'null'); if (w) { document.documentElement.classList.add('wipe-in'); document.documentElement.style.background = w.color; } } catch (e) {}</script>
  <link rel="stylesheet" href="mock.css">
  <link rel="stylesheet" href="fx.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="page" id="page"></main>
  <script src="icons.js"></script>
  <script src="vendor/motion.js"></script>
  <script src="fx.js"></script>
  <script src="mock.js"></script>
  <script src="demo.js"></script>
  <script>
    FX.ready(() => {
      const { data: d, q, exam } = MOCK;
      const params = new URLSearchParams(location.search);
      const fresh = params.get('fresh') === '1';
      const arrived = FX.arrive();
      const base = arrived ? 0.5 : 0.05;
      const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };
      const ico = (name, size) => icon(name, size).outerHTML;
      const $$ = (s) => [...document.querySelectorAll(s)];

      // Only modes that exist are shown. ?modes=all previews the future grid.
      const ALL = [
        ['list-checks', 'Quiz', 'Questions by topic or a random mix.', 'coral', `quiz.html${q()}`],
        ['layers', 'Flashcards', 'Cards you miss come back sooner.', 'lilac', '#'],
        ['crosshair', 'Weak spots', 'Only what you keep getting wrong.', 'sky', '#'],
        ['timer', 'Exam simulation', 'Timed, mixed, with a final score.', 'yellow', '#'],
        ['gamepad-2', 'Mini games', 'Matching, speed round, streaks.', 'cream', '#'],
      ];
      const modes = params.get('modes') === 'all' ? ALL : ALL.slice(0, 1);
      const S = fresh ? { practised: 0, total: d.total, accuracy: 0, streak: 0, weak: 0 } : d;

      const page = document.getElementById('page');
      page.append(el(`
        <section class="bento">
          <div class="hero" data-obj="o-hero" data-tilt="4" data-shine data-z="0">
            <div class="deco" aria-hidden="true">
              <div class="layer l-cube" data-depth="26"><div class="drift"><div class="cube"><i class="f1"></i><i class="f2"></i><i class="f3"></i><i class="f4"></i><i class="f5"></i><i class="f6"></i></div></div></div>
              <div class="layer l-star" data-depth="40"><div class="drift"><svg width="58" height="58" viewBox="0 0 20 20"><polygon points="10,1 12.6,7.2 19,7.8 14.2,12.2 15.6,18.6 10,15.2 4.4,18.6 5.8,12.2 1,7.8 7.4,7.2" fill="#ffd83d" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg></div></div>
              <div class="layer l-pencil" data-depth="56"><div class="drift"><svg width="30" height="84" viewBox="0 0 30 84"><g transform="rotate(24 15 42)"><rect x="3" y="4" width="24" height="9" rx="3" fill="#ff9f7a" stroke="currentColor" stroke-width="2"/><rect x="3" y="13" width="24" height="7" fill="#8fdbff" stroke="currentColor" stroke-width="2"/><rect x="3" y="20" width="24" height="42" fill="#ffd83d" stroke="currentColor" stroke-width="2"/><path d="M3 62 L15 82 L27 62 Z" fill="#fffdf8" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M11 74 L15 82 L19 74 Z" fill="#141414"/></g></svg></div></div>
              <div class="layer l-dot" data-depth="18"><div class="drift"><i></i></div></div>
            </div>
            <div class="hero-main">
              <h1>${d.name}</h1>
              <p class="sub">${fresh ? 'Nothing practised yet. Pick any topic below, or start with a random mix.' : d.desc}</p>
              <div class="chips">
                <span class="chip">${ico('book-open', 14)} ${d.format}</span>
                <button class="chip" id="notes-toggle" type="button" aria-expanded="false" aria-controls="notes">${ico('info', 14)} Material notes (${d.notes.length}) <span class="chev">${ico('chevron-down', 14)}</span></button>
              </div>
            </div>
            <a class="btn yellow xl" id="go" data-obj="o-btn" href="quiz.html${q()}">${ico('play', 22)} ${S.practised ? 'Continue quiz' : 'Start quiz'}</a>
          </div>
        </section>`));

      page.append(el(`
        <div class="notes" id="notes" data-open="false"><div><div class="note-card">
          <h3>${ico('triangle-alert', 20)} Where your course material is thin or missing</h3>
          <ul>${d.notes.map((n) => `<li><span class="warn-badge">${ico('triangle-alert', 13)}</span><span>${n}</span></li>`).join('')}</ul>
        </div></div></div>`));

      const tile = (cls, label, ic, to, small, rot, fmt) => `
        <div class="tile ${cls}" data-obj="o-tile" data-tilt="8" data-shine data-fill data-z="16" ${rot ? `data-rot="${rot}"` : ''}>
          <div class="top"><span class="lab">${label}</span>${ico(ic, 22)}</div>
          <div class="big"><span class="cnt" data-to="${to}" data-fmt="${fmt || ''}">${to}</span><small>${small}</small></div>
        </div>`;
      page.append(el(`
        <section class="stats" aria-label="Your progress">
          ${tile('cream', 'Practised', 'book-open-check', S.practised, `/ ${S.total}`)}
          ${tile('yellow', 'Accuracy', 'target', S.accuracy, '%', 1)}
          ${tile('coral', 'Current streak', 'flame', S.streak, 'in a row')}
          ${tile('lilac', 'Weak topics', 'triangle-alert', S.weak, 'to review', -1)}
        </section>`));

      page.append(el(`<h2 class="section">Ways to study</h2>`));
      page.append(el(`<div class="modes">${modes.map(([i, t, p, c, href]) => `
        <a class="mode ${c}" data-obj="o-mode" data-tilt="8" data-shine data-fill data-z="18" href="${href}">
          ${ico(i, 40)}
          <div><h3>${t}</h3><p>${p}</p></div>
        </a>`).join('')}</div>`));

      page.append(el(`<h2 class="section">Topics <span class="lab">Pick one to practise</span></h2>`));
      page.append(el(`<ul class="topics">${d.topics.map(([t, n, m, warn]) => {
        const mm = fresh ? 0 : m;
        const pct = Math.round((mm / n) * 100);
        return `<li><a class="trow" data-obj="o-row" data-z="10" href="quiz.html${q()}">
          <span class="name">${t}${warn ? `<span class="warn-badge" title="${warn}">${ico('triangle-alert', 13)}</span>` : ''}</span>
          <span class="count">${n} questions</span>
          <span class="segs" data-filled="${Math.round(pct / 10)}" aria-label="${pct}% mastered">${'<i></i>'.repeat(10)}</span>
          <span class="pct">${mm ? pct + '%' : '–'}</span>
        </a></li>`; }).join('')}</ul>`));

      FX.upgrade(page);

      // Notes panel
      const btn = document.getElementById('notes-toggle'), panel = document.getElementById('notes');
      btn.addEventListener('click', () => { const open = btn.getAttribute('aria-expanded') !== 'true'; btn.setAttribute('aria-expanded', String(open)); panel.dataset.open = String(open); FX.sound('click'); });
      if (params.get('notes') === 'open') btn.click();

      // Entrance: hero drops, tiles drop in 60ms apart with counting numbers, then modes and rows.
      FX.enter($$('.o-hero'), { y: -80, rotate: -2, delay: base, spring: FX.spring.deal });
      FX.enter($$('.stats > .obj'), { delay: base + 0.16, stagger: 0.06 });
      $$('.stats .cnt').forEach((c, i) => FX.count(c, +c.dataset.to, { duration: 0.95, delay: base + 0.3 + i * 0.06 }));
      FX.enter($$('.modes > .obj'), { y: 40, delay: base + 0.5, stagger: 0.06 });
      FX.enter($$('.topics > li'), { y: 28, delay: base + 0.62, stagger: 0.03, spring: FX.spring.soft });
      $$('.topics .segs').forEach((s, i) => FX.fillSegs(s, { delay: base + 0.95 + i * 0.03 }));

      // Topic rows: bar blocks ripple on hover
      $$('.trow').forEach((r) => r.addEventListener('pointerenter', () => FX.wave(r.querySelector('.segs'))));

      // Floating 3D bits: slow drift + parallax with the mouse
      Motion.animate($$('.cube')[0], { rotateX: -24, rotateY: 30 }, { duration: 0 });
      if (!FX.reduced()) {
        const layers = $$('.deco .layer');
        layers.forEach((l, i) => Motion.animate(l.querySelector('.drift'), { y: [0, -9, 0], rotate: i === 1 ? [-6, 8, -6] : [0, 3, 0] }, { duration: 3.2 + i * 0.7, repeat: Infinity, ease: 'easeInOut' }));
        Motion.animate($$('.cube')[0], { rotateY: [30, 390] }, { duration: 16, repeat: Infinity, ease: 'linear' });
        FX.parallax(document.querySelector('.hero'), layers);
      }

      // "Continue quiz" wiggles every ~6s to invite a click
      const go = document.getElementById('go');
      setInterval(() => {
        if (FX.reduced() || document.hidden || go.matches(':hover')) return;
        Motion.animate(go.closest('.obj'), { rotate: [0, -3, 3, -2, 1.5, 0], y: [0, -6, 0] }, { duration: 0.6, ease: 'easeOut' });
      }, 6000);

      window.EXAM = { fresh };
    });
  </script>
</body>
</html>
