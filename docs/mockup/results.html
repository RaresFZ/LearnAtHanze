<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results (mockup)</title>
  <script>try { var w = JSON.parse(sessionStorage.getItem('mock-wipe') || 'null'); if (w) { document.documentElement.classList.add('wipe-in'); document.documentElement.style.background = w.color; } } catch (e) {}</script>
  <link rel="stylesheet" href="mock.css">
  <link rel="stylesheet" href="fx.css">
  <style>
    .pagetitle { font: 800 44px/1 var(--head); letter-spacing: -0.035em; }
    .pagesub { margin: 14px 0 26px; }
    .score-card .mascot-spot { position: absolute; right: 38px; top: 20px; width: 84px; }
    .score-card .mascot-spot .mascot { width: 84px; }
    .score-card .stamp-spot { position: relative; }
    @media (max-width: 600px) { .pagetitle { font-size: 34px; } .score-card .mascot-spot { right: 14px; bottom: 6px; } }
  </style>
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="page" id="page"></main>
  <script src="icons.js"></script>
  <script src="vendor/motion.js"></script>
  <script src="fx.js"></script>
  <script src="mock.js"></script>
  <script src="demo.js"></script>
  <script>
    FX.ready(() => {
      const { exam, data: d, q } = MOCK;
      const params = new URLSearchParams(location.search);
      const arrived = FX.arrive();
      const base = arrived ? 0.55 : 0.05;
      const R = {
        a: {
          rows: [['Foundations & TPS', 4, 5], ['Measure: time, flow & capacity', 2, 3], ['Define: VOC, CTQ & SIPOC', 1, 2]],
          missed: [
            { q: 'What does First Time Right (FTR) measure?', a: 'Work completed correctly without rework on the first attempt', why: 'FTR = units completed correctly without rework on the first attempt ÷ units processed × 100%.', src: 'Green Belt Study Syllabus, Ch.6, p.7' },
            { q: 'What does the S in SIPOC stand for?', a: 'Suppliers', why: 'SIPOC = Suppliers, Inputs, Process, Outputs, Customers.', src: 'Lean Six Sigma 20 MC answer key, Q8' },
            { q: 'Which formula is Little’s Law?', a: 'Average WIP = throughput rate × average flow time', why: 'It holds for a stable system with consistent averages. It is an average relationship, not a guarantee for individual cases.', src: 'Green Belt Study Syllabus, Ch.6, p.7' },
          ],
        },
        b: {
          rows: [['SAFe', 3, 4], ['Managing the provider & contracts', 2, 3], ['IT audit', 2, 3]],
          missed: [
            { q: 'What happens in the problem-solving workshop of Inspect & Adapt?', a: 'Root cause analysis and action items, done by the entire ART in breakouts', why: 'I&A: PI System Demo, measurement, problem-solving workshop, then a confidence vote on improvement actions.', src: 'Lecture 7: Scaling Agile II, Slide 13' },
            { q: 'Who responds to the findings (Step 7) in the audit procedure?', a: 'The audited organization', why: 'Step 6 (analyze and report findings) is the auditor; step 7 (respond to findings) is the organization.', src: 'Lecture 1: Governance, Slide 23' },
            { q: 'How is the agreed exit plan tested?', a: 'Staged, on non-core business days, for example once every 2 years', why: 'Exit plan testing is part of exit management.', src: 'Lecture 5: Outsourcing II, Slide 11' },
          ],
        },
      }[exam];
      const correct = R.rows.reduce((s, r) => s + r[1], 0), all = R.rows.reduce((s, r) => s + r[2], 0);
      const pct = params.get('score') !== null ? +params.get('score') : Math.round((correct / all) * 100);
      // Encouragement stamp by score
      const stampText = pct >= 100 ? 'Boss mode' : pct >= 85 ? 'Nailed it' : pct >= 65 ? 'Solid' : pct >= 45 ? 'Almost' : 'Keep going';
      const mood = pct >= 65 ? 'happy' : pct >= 45 ? 'idle' : 'sad';
      const ico = (n, s) => icon(n, s).outerHTML;
      const segs = (p) => `<span class="segs" data-filled="${Math.round(p / 10)}">${'<i></i>'.repeat(10)}</span>`;
      const $$ = (s) => [...document.querySelectorAll(s)];

      document.getElementById('page').innerHTML = `
        <h1 class="pagetitle">Quiz finished</h1>
        <p class="pagesub lab">${d.short} / random mix / ${all} questions</p>
        <section class="results-top">
          <div class="score-card" data-obj="o-tile" data-tilt="4" data-shine data-fill data-z="12" id="score-card">
            <div class="score-row"><div class="score-num"><span id="num">${pct}</span><small>%</small></div>
              <div class="stamp-spot"><div class="stamp-wrap" id="stampwrap"><i class="stamp-shadow" id="stampshadow"></i><div class="stamp" id="stamp">${stampText}</div></div></div></div>
            <div class="meta"><p>${correct} of ${all} correct</p><span class="chip">${ico('flame', 14)} Best run 4 in a row</span><span class="chip">${all - correct} to review</span></div>
            <div class="mascot-spot" id="mspot"></div>
          </div>
          <div class="card" data-obj="o-tile" data-fill data-z="8" id="topic-card">
            <h3>By topic</h3>
            ${R.rows.map(([t, c, n]) => `<div class="brow"><div class="nm">${t}<span>${c} of ${n} correct</span></div>${segs(Math.round((c / n) * 100))}<span class="pct">${Math.round((c / n) * 100)}%</span></div>`).join('')}
          </div>
        </section>
        <h2 class="section">To review (${R.missed.length})</h2>
        <div class="review-list">
          ${R.missed.map((m, i) => `<details class="review" ${i === 0 ? 'open' : ''}><summary><span>${m.q}</span>${ico('chevron-down', 22)}</summary>
            <div class="body"><span class="lab">Answer</span><p class="answer"><span class="hl">${m.a}</span></p>
            <p class="why">${m.why}</p><p class="src">${ico('book-open', 14)} ${m.src}</p></div></details>`).join('')}
        </div>
        <div class="actions">
          <a class="btn yellow xl" data-obj="o-btn" href="quiz.html${q()}">${ico('rotate-ccw', 20)} Retry wrong ones (${R.missed.length})</a>
          <a class="btn xl" data-obj="o-btn" href="quiz.html${q()}">New quiz</a>
          <a class="btn textlink" href="exam.html${q()}">Back to exam</a>
        </div>`;
      FX.upgrade(document.getElementById('page'));

      // Make the stamp's face a stamp even in the tile-wrapped card
      const mascot = FX.mascot(); document.getElementById('mspot').append(mascot); mascot.dataset.mood = mood === 'idle' ? 'idle' : mood;

      const stampWrap = document.getElementById('stampwrap'), stampShadow = document.getElementById('stampshadow');
      const page = document.getElementById('page');
      Motion.animate(stampWrap, { opacity: 0 }, { duration: 0 });
      Motion.animate(stampShadow, { x: 0, y: 0 }, { duration: 0 });

      // 1. cards drop in, number counts up, bars fill block by block
      FX.enter($$('.results-top > .obj'), { delay: base, stagger: 0.08, y: -50 });
      FX.count(document.getElementById('num'), pct, { duration: 1.05, delay: base + 0.15 });
      $$('.brow .segs').forEach((s, i) => FX.fillSegs(s, { delay: base + 0.35 + i * 0.12 }));
      FX.enter($$('.review-list > details, .actions > .obj, .actions > a, h2.section'), { y: 22, delay: base + 0.7, stagger: 0.05, spring: FX.spring.soft });

      // 2. the stamp lands last: drops from above, thud, tiny shake, hard shadow snaps in
      const land = () => {
        FX.sound('thud');
        FX.anim(stampWrap, { scale: [1, 0.9, 1.04, 1] }, { duration: 0.34, ease: 'easeOut' });
        FX.anim(stampShadow, { x: [0, 5], y: [0, 5] }, { ...FX.spring.thud });
        FX.anim(page, { x: [0, -7, 6, -4, 2, 0], y: [0, 5, -3, 2, 0, 0] }, { duration: 0.34 });
        if (pct >= 65) FX.confetti(stampWrap.getBoundingClientRect().left + 60, stampWrap.getBoundingClientRect().top + 20, { count: 20 });
        mascot.mood(mood === 'sad' ? 'sad' : 'happy', 3000);
      };
      const drop = () => {
        Motion.animate(stampWrap, { opacity: 0, y: -440, scale: 2.6, rotate: -26 }, { duration: 0 });
        FX.anim(stampWrap, { opacity: [0, 1], y: [-440, 0], scale: [2.6, 1], rotate: [-26, -7] }, { duration: 0.34, ease: [0.55, 0, 0.9, 0.6] }).then(land, land);
      };
      setTimeout(drop, FX.reduced() ? 0 : (base + 1.25) * 1000);
      if (FX.reduced()) { Motion.animate(stampWrap, { opacity: 1, rotate: -7 }, { duration: 0 }); Motion.animate(stampShadow, { x: 5, y: 5 }, { duration: 0 }); }

      window.RESULTS = { drop };
    });
  </script>
</body>
</html>
