<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz question (mockup)</title>
  <script>try { var w = JSON.parse(sessionStorage.getItem('mock-wipe') || 'null'); if (w) { document.documentElement.classList.add('wipe-in'); document.documentElement.style.background = w.color; } } catch (e) {}</script>
  <link rel="stylesheet" href="mock.css">
  <link rel="stylesheet" href="fx.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="page"><div class="quiz-wrap" id="quiz"></div></main>
  <script src="icons.js"></script>
  <script src="vendor/motion.js"></script>
  <script src="fx.js"></script>
  <script src="mock.js"></script>
  <script src="demo.js"></script>
  <script>
    FX.ready(() => {
      const { exam, q: qs } = MOCK;
      const params = new URLSearchParams(location.search);
      const arrived = FX.arrive();
      const base = arrived ? 0.55 : 0.05;
      const QUESTIONS = {
        a: [
          { topic: 'Foundations & TPS', type: 'Multiple choice', q: 'What does Jidoka mean in TPS?', answer: 3,
            options: ['Producing what is needed exactly when it is needed', 'Levelling production volume and mix', 'A visual or audible signal requesting support', 'Building quality into the process and stopping to address abnormalities'],
            why: 'Jidoka stops or signals an abnormal condition. Just-in-Time is the other pillar of TPS.', src: 'Green Belt Study Syllabus, Ch.1, p.3' },
          { topic: 'Foundations & TPS', type: 'Multiple choice', q: 'An unstable schedule leads to overtime, errors and queues. Which chain of the 3Ms describes this?', answer: 1,
            options: ['Muda causes Mura, which removes Muri', 'Mura (unevenness) causes Muri (overburden), which leads to Muda (waste)', 'Muri causes Kaizen, which removes Mura', 'Muda and Muri are unrelated to Mura'],
            why: 'The 3Ms reinforce one another: unstable schedules (Mura) can cause overtime (Muri), errors and queues (Muda).', src: 'Green Belt Study Syllabus, Ch.1, p.3' },
          { topic: 'Define: VOC, CTQ & SIPOC', type: 'Multiple choice', q: 'What does the S in SIPOC stand for?', answer: 1,
            options: ['Systems', 'Suppliers', 'Solutions', 'Standards'],
            why: 'SIPOC = Suppliers, Inputs, Process, Outputs, Customers.', src: 'Lean Six Sigma 20 MC answer key, Q8' },
        ],
        b: [
          { topic: 'SAFe', type: 'Multiple choice', q: 'Which SAFe role ensures technical integrity and defines the architectural guidelines for the teams?', answer: 2,
            options: ['Release Train Engineer', 'Scrum of Scrums Master', 'System Architect', 'Product Owner (program level)'],
            why: 'Other roles: the program-level Product Owner, and the Scrum of Scrums Master who facilitates the team Scrum Master meetings.', src: 'Lecture 7: Scaling Agile II, Slide 7' },
          { topic: 'Managing the provider & contracts', type: 'Multiple choice', q: 'What risk does the lecture describe for an organisation’s own overseas IT department (a captive)?', answer: 0,
            options: ['It is seen as a cost centre or back office, leading to low empowerment and low motivation', 'It always costs more than the headquarters IT', 'It cannot hold knowledge', 'It cannot cooperate with an SPO'],
            why: 'Face-to-face interaction is essential, so letting employees and management travel across is worth the money.', src: 'Lecture 5: Outsourcing II, Slide 10' },
          { topic: 'IT audit', type: 'Multiple choice', q: 'Who issues the final audit report (Step 8)?', answer: 0,
            options: ['The auditor', 'The organization', 'Both together', 'The CEO'],
            why: 'Step 8: issue final report (auditor).', src: 'Lecture 1: Governance, Slide 23' },
        ],
      }[exam];

      const root = document.getElementById('quiz');
      const total = 10;
      let n = params.get('n') !== null ? +params.get('n') : 3;   // zero-based: shows "Question 4 / 10"
      let qi = 0;
      let streak = params.get('streak') !== null ? +params.get('streak') : 3;
      let answered = false;
      let card = null;
      const ico = (name, s) => icon(name, s).outerHTML;
      const SCRIBBLE = '<svg class="scribble" viewBox="0 0 200 18" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M2 11 C 22 3, 42 16, 64 8 S 104 14, 126 7 S 170 13, 198 6"/></svg>';
      const FLAME = '<svg viewBox="0 0 16 22" aria-hidden="true"><path d="M8 1 C 9 6 14 8 14 14 C 14 18 11 21 8 21 C 5 21 2 18 2 14 C 2 11 4 10 5 7 C 6 8 7 8 7.5 6 C 8 4 8 3 8 1 Z" fill="#ff9f7a" stroke="#141414" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 11 C 9 13 11 14 11 16 C 11 18 9.5 19 8 19 C 6.5 19 5 18 5 16 C 5 14 7 13 8 11Z" fill="#ffd83d"/></svg>';

      root.innerHTML = `
        <div class="quiz-top">
          <div class="left">
            <a class="icon-btn" href="exam.html${qs()}" data-obj="o-icon" aria-label="Exit quiz">${ico('x', 18)}</a>
            <span class="lab" id="count"></span>
          </div>
          <div id="sticker-slot"></div>
        </div>
        <div class="quiz-segs" id="segs" role="progressbar" aria-valuemin="0" aria-valuemax="${total}"></div>
        <div class="deck" id="deck"></div>`;
      const segsEl = document.getElementById('segs');
      const mascot = FX.mascot();
      document.getElementById('deck').append(mascot);
      FX.upgrade(root);

      // ---- progress blocks ----
      Array.from({ length: total }, () => segsEl.append(document.createElement('i')));
      const paintSegs = (animate) => {
        [...segsEl.children].forEach((b, i) => {
          b.className = i < n ? 'done' : i === n ? 'current' : '';
          if (i < n && animate) { Motion.animate(b, { scale: 0, opacity: 0 }, { duration: 0 }); FX.anim(b, { scale: 1, opacity: 1 }, { ...FX.spring.bouncy, delay: base + i * 0.04 }); }
        });
        segsEl.setAttribute('aria-valuenow', n);
        document.getElementById('count').textContent = `Question ${n + 1} / ${total}`;
      };
      paintSegs(true);

      // ---- streak sticker ----
      const slot = document.getElementById('sticker-slot');
      slot.innerHTML = `<div class="sticker-wrap" id="sw"><div class="flames" id="flames"></div><span class="sticker">${ico('flame', 16)} <b class="roll" id="roll">${streak}</b> in a row</span></div>`;
      const sw = document.getElementById('sw'), roll = document.getElementById('roll'), flames = document.getElementById('flames');
      Motion.animate(sw, { rotate: -2 }, { duration: 0 });
      const level = (s) => (s >= 10 ? 3 : s >= 5 ? 2 : s >= 3 ? 1 : 0);
      const paintFlames = () => { const L = level(streak); flames.className = 'flames lvl' + L; flames.innerHTML = FLAME.repeat(L ? L * 2 + 1 : 0); };
      const paintSticker = (pop) => {
        const show = streak >= 2;
        roll.textContent = streak; paintFlames();
        if (show) { sw.style.display = ''; if (pop) { FX.anim(sw, { scale: [0.7, 1.18, 1], rotate: [-2, -8, -2] }, { duration: 0.5, ease: 'easeOut' }); FX.anim(roll, { y: [16, 0], opacity: [0, 1] }, FX.spring.bouncy); } }
        else if (pop) { FX.anim(sw, { scale: [1, 0.2], opacity: [1, 0] }, { duration: 0.22 }).then(() => { sw.style.display = 'none'; Motion.animate(sw, { scale: 1, opacity: 1 }, { duration: 0 }); }); }
        else sw.style.display = 'none';
      };
      paintSticker(false);

      // ---- the card ----
      const buildCard = () => {
        const Q = QUESTIONS[qi % QUESTIONS.length];
        const last = n === total - 1;
        const wrap = document.createElement('div');
        wrap.innerHTML = `
          <article class="qcard" data-obj="o-card">
            <div class="qmeta"><span class="chip accent">${Q.topic}</span><span class="chip">${Q.type}</span></div>
            <h1 class="qtext">${Q.q}</h1>
            <div class="options">
              ${Q.options.map((o, i) => `<button class="opt" type="button" data-i="${i}" data-obj="o-opt" data-tilt="3" data-z="20"><span class="key">${i + 1}</span><span class="txt"><span class="ink">${o}</span></span><span class="state"></span></button>`).join('')}
            </div>
            <div id="fb"></div>
            <div class="qfoot">
              <div class="hints"><span><kbd>1</kbd><kbd>${Q.options.length}</kbd> answer</span><span><kbd>Enter</kbd> next</span></div>
              <button class="btn yellow" id="next" type="button" data-obj="o-btn" disabled>${last ? 'See results' : 'Next question'}</button>
            </div>
          </article>`;
        FX.upgrade(wrap);
        const obj = wrap.firstElementChild;
        obj.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', (e) => answer(+b.dataset.i, e.clientX ? e : null)));
        obj.querySelector('#next').addEventListener('click', next);
        return obj;
      };
      const deal = (delay = 0) => {
        card = buildCard();
        document.getElementById('deck').append(card);
        Motion.animate(card, { opacity: 0, rotateX: -18, y: -70, x: -36, rotate: -3 }, { duration: 0 });
        FX.anim(card, { opacity: 1, rotateX: 0, y: 0, x: 0, rotate: 0 }, { ...FX.spring.deal, delay });
        answered = false;
      };

      const optObj = (i) => card.querySelectorAll('.o-opt')[i];
      const centre = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

      function answer(i, evt) {
        if (answered) return;
        answered = true;
        const Q = QUESTIONS[qi % QUESTIONS.length];
        const right = i === Q.answer;
        const objs = [...card.querySelectorAll('.o-opt')];
        objs.forEach((o, k) => {
          o.dataset.locked = '1';
          const face = o._p.face, st = face.querySelector('.state');
          if (k === Q.answer) {
            face.classList.add('right'); st.innerHTML = ico('check', 24);
            if (!right) { face.querySelector('.ink').style.animationDelay = '0.3s'; setTimeout(() => FX.anim(o, { scale: [1, 1.05, 1] }, FX.spring.bouncy), 260); }
          } else if (k === i) {
            face.classList.add('wrong'); st.innerHTML = ico('x', 24);
            face.querySelector('.ink').insertAdjacentHTML('beforeend', SCRIBBLE);
          } else o.classList.add('dimmed');
          if (k === i) FX.anim(o._p.lift, { x: 4, y: 4, z: 0 }, FX.spring.snappy); else FX.anim(o._p.lift, { x: 0, y: 0, z: 0 }, FX.spring.snappy);
        });
        const chosen = objs[i];
        const [cx, cy] = evt ? [evt.clientX, evt.clientY] : centre(chosen._p.face);

        // progress block: pop and flash
        const cur = segsEl.querySelector('i.current');
        if (cur) { cur.className = 'done ' + (right ? 'flash-good' : 'flash-bad'); FX.anim(cur, { scale: [1.25, 1] }, FX.spring.bouncy); }

        if (right) {
          streak += 1;
          const milestone = [3, 5, 10].includes(streak);
          FX.confetti(cx, cy, { count: 24 });
          FX.sound(milestone ? 'big' : 'pop');
          paintSticker(true);
          mascot.mood('happy', milestone ? 2600 : 1900);
          if (milestone) {
            const [sx, sy] = centre(sw);
            FX.confetti(sx, sy, { count: 30, big: true });
            FX.anim(sw, { scale: [1, 1.5, 1], rotate: [-2, 10, -4, -2] }, { type: 'spring', stiffness: 300, damping: 9 });
          }
        } else {
          streak = 0;
          FX.sound('thud');
          FX.anim(chosen, { x: [0, -11, 11, -9, 9, -5, 3, 0] }, { duration: 0.42 });
          paintSticker(true);
          mascot.mood('sad', 2200);
        }

        document.getElementById('fb').innerHTML = `
          <div class="note-wrap"><div class="note-card fb">
            <span class="label ${right ? 'good' : 'bad'}">${ico(right ? 'check' : 'x', 14)} ${right ? 'Correct' : 'Not quite'}</span>
            <p class="explain">${Q.why}</p>
            <p class="source">${ico('book-open', 14)} ${Q.src}</p>
          </div></div>`;
        const nw = card.querySelector('.note-wrap');
        Motion.animate(nw, { opacity: 0, y: 26 }, { duration: 0 });
        FX.anim(nw, { opacity: 1, y: 0 }, { ...FX.spring.deal, delay: 0.12 });
        const nx = card.querySelector('#next'); nx.disabled = false; nx.focus({ preventScroll: true });
      }

      function next() {
        if (!answered) return;
        if (n >= total - 1) { FX.go('results.html' + qs(), { kind: 'results' }); return; }
        const old = card; answered = true;
        const after = () => {
          old.remove(); n += 1; qi += 1; paintSegs(false);
          const cur = segsEl.querySelector('i.current'); if (cur) FX.anim(cur, { scale: [1.3, 1] }, FX.spring.bouncy);
          mascot.dataset.mood = 'idle';
          deal(0);
        };
        FX.anim(old, { x: 560, y: -110, rotate: 14, opacity: 0 }, { duration: 0.3, ease: [0.5, 0, 0.9, 0.5] }).then(after, after);
      }

      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const Q = QUESTIONS[qi % QUESTIONS.length];
        if (!answered && /^[1-9]$/.test(e.key) && +e.key <= Q.options.length) { answer(+e.key - 1, null); e.preventDefault(); }
        else if (answered && e.key === 'Enter') { next(); e.preventDefault(); }
      });

      deal(base);
      window.QUIZ = { answer: (i) => answer(i, null), next, correct: () => QUESTIONS[qi % QUESTIONS.length].answer, optObj, get card() { return card; } };

      const state = params.get('state');
      if (state === 'correct') setTimeout(() => answer(QUESTIONS[0].answer, null), 1100);
      if (state === 'wrong') setTimeout(() => answer((QUESTIONS[0].answer + 1) % QUESTIONS[0].options.length, null), 1100);
    });
  </script>
</body>
</html>
